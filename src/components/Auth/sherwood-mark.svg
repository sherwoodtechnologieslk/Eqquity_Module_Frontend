<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <!--
    Proportions from original mark:
    arrow tip of fletching ~1.45x circle radius from center
  -->
  <circle cx="130" cy="178" r="108" fill="rgba(255,255,255,0.1)"/>
  <circle cx="130" cy="178" r="104" fill="#77C262"/>
  <circle cx="130" cy="178" r="104" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.55" fill="none"/>

  <circle cx="130" cy="178" r="54" stroke="#FFFFFF" stroke-width="13" fill="none"/>
  <circle cx="130" cy="178" r="24" stroke="#FFFFFF" stroke-width="11" fill="none"/>

  <!-- Arrow at ~-42°, full shaft + fletching past the disc -->
  <g transform="rotate(-42 130 178)">
    <!-- long shaft from bullseye outward -->
    <rect x="130" y="170" width="138" height="16" rx="3" fill="#4F4C4C"/>
    <!-- blunt tip in center -->
    <circle cx="130" cy="178" r="8" fill="#4F4C4C"/>
    <!-- upper fletching (full end of arrow) -->
    <path d="M248 158 L286 146 L286 170 L248 170 Z" fill="#4F4C4C"/>
    <!-- lower fletching -->
    <path d="M248 198 L286 210 L286 186 L248 186 Z" fill="#4F4C4C"/>
  </g>
</svg>
