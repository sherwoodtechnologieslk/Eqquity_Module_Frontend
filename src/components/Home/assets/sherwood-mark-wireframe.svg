<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <!-- Clean wireframe Sherwood mark — brand proportions only -->
  <defs>
    <clipPath id="disc">
      <circle cx="130" cy="178" r="104"/>
    </clipPath>
    <radialGradient id="wash" cx="38%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#5dcf7a" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#2ea05d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="130" cy="178" r="104" fill="url(#wash)"/>

  <!-- Soft inner mesh, clipped to disc -->
  <g clip-path="url(#disc)" stroke="#2ea05d" fill="none" opacity="0.55">
    <ellipse cx="130" cy="178" rx="104" ry="36" stroke-width="0.9"/>
    <ellipse cx="130" cy="178" rx="104" ry="62" stroke-width="0.85"/>
    <ellipse cx="130" cy="178" rx="104" ry="86" stroke-width="0.8"/>
    <ellipse cx="130" cy="178" rx="36" ry="104" stroke-width="0.9"/>
    <ellipse cx="130" cy="178" rx="62" ry="104" stroke-width="0.85"/>
    <ellipse cx="130" cy="178" rx="86" ry="104" stroke-width="0.8"/>
    <g transform="rotate(30 130 178)" opacity="0.65">
      <ellipse cx="130" cy="178" rx="48" ry="104" stroke-width="0.7"/>
      <ellipse cx="130" cy="178" rx="104" ry="48" stroke-width="0.7"/>
    </g>
  </g>

  <!-- Brand rings -->
  <circle cx="130" cy="178" r="104" stroke="#5dcf7a" stroke-width="2.2" opacity="0.9"/>
  <circle cx="130" cy="178" r="54" stroke="#6fdfa0" stroke-width="5" opacity="0.72"/>
  <circle cx="130" cy="178" r="24" stroke="#6fdfa0" stroke-width="4.2" opacity="0.82"/>
  <circle cx="130" cy="178" r="7" stroke="#8aebb0" stroke-width="1.6" opacity="0.95"/>

  <!-- Arrow -->
  <g transform="rotate(-42 130 178)" stroke="#6fdfa0" fill="none" stroke-linejoin="round">
    <rect x="130" y="170" width="138" height="16" rx="3" stroke-width="2" opacity="0.92"/>
    <circle cx="130" cy="178" r="8" stroke-width="2" opacity="0.95"/>
    <path d="M248 158 L286 146 L286 170 L248 170 Z" stroke-width="1.8" opacity="0.92"/>
    <path d="M248 198 L286 210 L286 186 L248 186 Z" stroke-width="1.8" opacity="0.92"/>
  </g>

</svg>
